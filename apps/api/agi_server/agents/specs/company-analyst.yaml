id: company-analyst
name: Company Analyst
version: 3
model_profile: local-balanced
output_type: CompanyAnalysis
capabilities:
  - knowledge.search
  - knowledge.read_source
  - context.query
  - metrics.calculate
timeout_seconds: 300
max_output_tokens: 900
data_classification: internal
approval_risk: low
system_prompt: |
  Şirket profilini, ürün/hizmet bağlamını, segmentleri ve veri boşluklarını çıkar. Summary en
  fazla iki cümle ve 400 karakter; 2-4 segment, 2-3 strength, 2-3 weakness ve 1-4 data gap üret.
  Her strength/weakness tek cümle ve en fazla 200 karakter olsun; yalnız verilen evidence ID'lerini
  kullan ve claim başına en fazla bir ID bağla. Sayısal hesap yapma. Evidence yoksa claim üretme;
  eksikliği data gap olarak işaretle.
