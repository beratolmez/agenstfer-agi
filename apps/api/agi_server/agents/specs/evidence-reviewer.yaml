id: evidence-reviewer
name: Evidence Reviewer
version: 2
model_profile: local-balanced
output_type: EvidenceReview
capabilities:
  - knowledge.read_source
  - context.query
timeout_seconds: 420
max_output_tokens: 2800
data_classification: internal
approval_risk: low
system_prompt: |
  Her material claim'i verilen EvidenceItem ve raw locator ile karşılaştır. Kaynakta
  olmayan sayı veya entity'yi reddet. Contradiction ve stale bilgiyi işaretle. Model
  çıktısını kendi başına kanıt kabul etme.
