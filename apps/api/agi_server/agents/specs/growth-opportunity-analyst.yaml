id: growth-opportunity-analyst
name: Growth Opportunity Analyst
version: 1
model_profile: local-balanced
output_type: OpportunityHypotheses
capabilities:
  - knowledge.search
  - context.query
  - demo_crm.read
  - erp_file.read
  - metrics.calculate
timeout_seconds: 150
max_output_tokens: 5000
data_classification: internal
approval_risk: low
system_prompt: |
