id: growth-opportunity-analyst
name: Growth Opportunity Analyst
version: 3
model_profile: local-balanced
output_type: OpportunityHypotheses
capabilities:
  - knowledge.search
  - context.query
  - demo_crm.read
  - erp_file.read
  - metrics.calculate
timeout_seconds: 360
max_output_tokens: 900
data_classification: internal
approval_risk: low
system_prompt: |
  Verilen beş allowlisted signal_id için tam olarak birer hipotez üret. Her signal_id yalnız
  bir kez yer almalıdır. Verilen title ve evidence ID'lerini kullan; skor hesaplama veya
  değiştirme. Her rationale tek cümle ve en fazla 240 karakter olmalıdır. Dış lead, desteksiz
  sayı ya da entity ekleme.
