[project]
name = "rag-service"
version = "0.1.0"
description = "RAG service for OKF Wiki and structured data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5.0",
    "langchain-text-splitters>=0.2.2",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
