name: agentic-growth-intelligence

services:
  app:
    build: .
    environment:
      AGI_ENVIRONMENT: ${AGI_ENVIRONMENT:-development}
      AGI_BOOTSTRAP_TOKEN: ${AGI_BOOTSTRAP_TOKEN:-replace-this-one-time-token}
      AGI_SESSION_SECRET: ${AGI_SESSION_SECRET:-replace-with-at-least-32-random-characters}
      AGI_MASTER_KEY: ${AGI_MASTER_KEY:-replace-with-a-docker-secret-in-production}
      AGI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agi}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-agi}
      AGI_DEMO_NO_AUTH: "false"
      AGI_KNOWLEDGE_ROOT: /data/knowledge
      AGI_OLLAMA_BASE_URL: http://ollama:11434/v1
      AGI_MODEL_PROFILE: ${AGI_MODEL_PROFILE:-local-balanced}
      AGI_QMD_URL: http://qmd:8181
      AGI_CLOUD_MODELS_ENABLED: ${AGI_CLOUD_MODELS_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME:-gemini-3.6-flash}
    volumes:
      - knowledge_data:/data/knowledge
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core]
    restart: unless-stopped

  web-proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./infra/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [core, ingress]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agi}
      POSTGRES_USER: ${POSTGRES_USER:-agi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [core]
    restart: unless-stopped



  qmd:
    profiles: [search]
    build: ./infra/qmd
    # OKF active bundle is immutable source of truth; qmd/chroma index is disposable derived index
    environment:
      QMD_COLLECTION_PATH: /knowledge/bundles/company
      QMD_COLLECTION_NAME: company
    volumes:
      - knowledge_data:/knowledge:ro
      - qmd_data:/root/.cache/qmd
    networks: [core]
    restart: unless-stopped

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.19.0@sha256:ede4864215be4cd85bd8c3129a2fea6c5713c5653c7282c429dba123014bc68b
    ports:
      - "16686:16686"
    networks: [core, ingress]

  egress-gateway:
    profiles: [cloud]
    image: ubuntu/squid:6.10-24.10_edge@sha256:c9f5212b147a766529c7b026e2bebed37b998d33d0066b658596af5eba7cc65c
    volumes:
      - ./infra/egress/squid.conf:/etc/squid/squid.conf:ro
    networks: [core, egress]

networks:
  core:
    internal: true
  ingress: {}
  egress: {}

volumes:
  postgres_data:
  knowledge_data:
  qmd_data:
