name: agentic-growth-intelligence-production

services:
  app:
    image: ${AGI_DOCKER_IMAGE:-beratolmez/agenstfer-agi:latest}
    environment:
      AGI_ENVIRONMENT: production
      AGI_BOOTSTRAP_TOKEN: ${AGI_BOOTSTRAP_TOKEN}
      AGI_SESSION_SECRET: ${AGI_SESSION_SECRET}
      AGI_MASTER_KEY: ${AGI_MASTER_KEY}
      AGI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AGI_DEMO_NO_AUTH: "false"
      AGI_KNOWLEDGE_ROOT: /data/knowledge
      AGI_CLOUD_MODELS_ENABLED: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL_NAME: ${GEMINI_MODEL_NAME:-gemini-2.0-flash}
    volumes:
      - knowledge_data:/data/knowledge
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [core]
    restart: always

  web-proxy:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl_certs:/etc/nginx/certs:ro
    networks: [core, ingress]
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agi}
      POSTGRES_USER: ${POSTGRES_USER:-agi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [core]
    restart: always

networks:
  core:
    internal: true
  ingress: {}

volumes:
  postgres_data:
  knowledge_data:
  ssl_certs:
