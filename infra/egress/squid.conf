http_port 3128
acl SSL_ports port 443
acl Safe_ports port 80 443
acl cloud_model_providers dstdomain .api.groq.com .api.mistral.ai
# Sadece iki OpenAI-compatible model provider'ına HTTPS CONNECT izni vardır.
http_access allow cloud_model_providers
http_access deny all
access_log stdio:/var/log/squid/access.log
