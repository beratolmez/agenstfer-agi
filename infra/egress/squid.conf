http_port 3128
acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80 443
acl cloud_model_providers dstdomain .generativelanguage.googleapis.com .api.groq.com .api.mistral.ai .openrouter.ai
# Sadece onaylı OpenAI-compatible model provider'larına HTTPS CONNECT izni vardır.
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow CONNECT cloud_model_providers
http_access deny all
access_log stdio:/var/log/squid/access.log
