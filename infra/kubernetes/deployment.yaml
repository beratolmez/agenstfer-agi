apiVersion: apps/v1
kind: Deployment
metadata:
  name: agi-api
  namespace: agi-production
  labels:
    app: agi-api
    component: api-control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agi-api
  template:
    metadata:
      labels:
        app: agi-api
        component: api-control-plane
    spec:
      containers:
        - name: agi-api-server
          image: beratolmez/agenstfer-agi:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: agi-config
            - secretRef:
                name: agi-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: knowledge-volume
              mountPath: /data/knowledge
      volumes:
        - name: knowledge-volume
          persistentVolumeClaim:
            claimName: agi-knowledge-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: agi-api-service
  namespace: agi-production
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: agi-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agi-worker
  namespace: agi-production
  labels:
    app: agi-worker
    component: background-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agi-worker
  template:
    metadata:
      labels:
        app: agi-worker
        component: background-worker
    spec:
      containers:
        - name: agi-event-worker
          image: beratolmez/agenstfer-agi:latest
          imagePullPolicy: Always
          command: ["python", "-m", "agi_server.workflow.scheduler"]
          envFrom:
            - configMapRef:
                name: agi-config
            - secretRef:
                name: agi-secrets
          volumeMounts:
            - name: knowledge-volume
              mountPath: /data/knowledge
      volumes:
        - name: knowledge-volume
          persistentVolumeClaim:
            claimName: agi-knowledge-pvc
