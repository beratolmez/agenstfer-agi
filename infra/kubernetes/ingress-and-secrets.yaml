apiVersion: v1
kind: ConfigMap
metadata:
  name: agi-config
  namespace: agi-production
data:
  AGI_ENVIRONMENT: "production"
  AGI_DEMO_NO_AUTH: "false"
  AGI_KNOWLEDGE_ROOT: "/data/knowledge"
  AGI_MODEL_PROFILE: "local-balanced"
  AGI_CLOUD_MODELS_ENABLED: "false"
---
# Production secrets must be provisioned via ExternalSecrets / Vault / KMS.
# Plaintext secrets are strictly prohibited from Git repository manifests.
apiVersion: v1
kind: Secret
metadata:
  name: agi-secrets
  namespace: agi-production
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<SET_VIA_SECRET_STORE>"
  AGI_DATABASE_URL: "<SET_VIA_SECRET_STORE>"
  AGI_BOOTSTRAP_TOKEN: "<SET_VIA_SECRET_STORE>"
  AGI_SESSION_SECRET: "<SET_VIA_SECRET_STORE>"
  AGI_MASTER_KEY: "<SET_VIA_SECRET_STORE>"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agi-ingress
  namespace: agi-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - agi.customer.com
      secretName: agi-tls-cert
  rules:
    - host: agi.customer.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agi-api-service
                port:
                  number: 8080
