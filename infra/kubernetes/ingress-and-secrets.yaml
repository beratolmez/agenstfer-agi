apiVersion: v1
kind: ConfigMap
metadata:
  name: agi-config
  namespace: agi-production
data:
  AGI_ENVIRONMENT: "production"
  AGI_DEMO_NO_AUTH: "false"
  AGI_KNOWLEDGE_ROOT: "/data/knowledge"
  AGI_DATABASE_URL: "postgresql+psycopg://agi:change-me@agi-postgres-service:5432/agi"
  AGI_CLOUD_MODELS_ENABLED: "true"
  GEMINI_MODEL_NAME: "gemini-2.0-flash"
---
apiVersion: v1
kind: Secret
metadata:
  name: agi-secrets
  namespace: agi-production
type: Opaque
stringData:
  POSTGRES_PASSWORD: "production-secure-postgres-password-change-me"
  AGI_BOOTSTRAP_TOKEN: "production-bootstrap-secret-token-min-24-chars"
  AGI_SESSION_SECRET: "production-session-secret-min-32-chars-long"
  AGI_MASTER_KEY: "production-master-key-min-32-chars-long"
  GEMINI_API_KEY: "AIzaSyProductionKeyConfiguredInK8s"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agi-ingress
  namespace: agi-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - agi.customer.com
      secretName: agi-tls-cert
  rules:
    - host: agi.customer.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agi-app-service
                port:
                  number: 8080
